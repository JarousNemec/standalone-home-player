# === DEBUG compose pro Windows / vývoj (BEZ zvuku) ===
# Spuštění z KOŘENE projektu:
#   docker compose -f debug/docker-compose.debug.yml up --build
# Pak otevři: http://localhost:8080
#
# Rozdíly oproti produkčnímu docker-compose.yml:
#   - MPV_AO=null  → mpv přehrává "naslepo" (na Windows není /dev/snd)
#   - žádné devices /dev/snd ani group_add audio (nefunguje na Docker Desktop)
#   - konfigurace inline (nepotřebuje .env)

services:
  player:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: home-yt-player-debug
    environment:
      PORT: "8080"
      MPV_AO: "null"                       # <<< klíčové: bez zvukového HW
      YTMUSIC_AUTH: "/config/browser.json" # pokud chybí → anonymní režim
      YTDLP_COOKIES: "/config/cookies.txt" # pokud chybí/prázdné → bez Premium
      DEFAULT_VOLUME: "100"
      RADIO_REFILL_THRESHOLD: "3"
    ports:
      - "8080:8080"
    volumes:
      - ../config:/config
